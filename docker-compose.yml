services:
  vpn:
    image: v2fly/v2fly-core:v5.30.0
    env_file:
      - ./.env
    command: run -c /etc/v2fly/config.json
    networks: [traefik]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - traefik.tcp.routers.tgo.entrypoints=https
      - "traefik.tcp.routers.tgo.rule=HostSNI(`${SERVER_HOST}`)"
      - traefik.tcp.routers.tgo.tls=true
      - traefik.tcp.routers.tgo.tls.passthrough=true
      - traefik.tcp.routers.tgo.tls.certresolver=letsEncrypt
      - traefik.tcp.services.tgo.loadbalancer.server.port=443
    volumes:
      - type: bind
        source: v2ray.json
        target: /etc/v2fly/config.json
      - "/usr/local/share/letsencrypt/${SERVER_HOST}:/certs/"
networks:
  traefik:
    external: true